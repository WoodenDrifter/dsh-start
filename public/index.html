<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH 控制台</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/layout.css" />
    <link rel="stylesheet" href="/styles/components.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">D</div>
          <div>
            <div class="brand-name">DSH 控制台</div>
            <div class="brand-sub">dsh web</div>
          </div>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="side-foot">
          <div id="foot">正在连接…</div>
          <div class="row" style="gap: 6px; margin-top: 6px">
            <button class="btn ghost sm" id="quit" title="关闭控制台（不影响 dsh web）">退出</button>
            <span class="dim" id="jobbar" style="font-size: 11px"></span>
          </div>
        </div>
      </aside>
      <main class="main" id="view"></main>
    </div>
    <div class="toasts" id="toasts"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
